# Agent Process Manager Configuration Example

server:
  host: "0.0.0.0"
  port: 7337

storage:
  database_url: "sqlite:apm.db"
  log_retention_days: 7
  max_log_size_mb: 1000

ui:
  theme: "dark"
  dashboard_auth: "none"  # none | basic | oauth

# Keyboard shortcuts
shortcuts:
  attach_detach: "ctrl+b,d"
  attach_kill: "ctrl+b,k"

# Custom pattern detection
patterns:
  custom:
    - name: "deployment_url"
      pattern: "deployed to (https://[^\\s]+)"
      severity: "info"
    
    - name: "docker_port"
      pattern: "0\\.0\\.0\\.0:(\\d+)->\\d+/tcp"
      severity: "info"
    
    - name: "test_summary"
      pattern: "(\\d+) tests?, (\\d+) passed"
      severity: "info"

# Terminal attachment settings
attach:
  default_size:
    rows: 40
    cols: 120

# MCP (Model Context Protocol) server settings
mcp:
  enabled: false         # Enable MCP server alongside HTTP API
  transport: "tcp"       # "tcp" or "unix_socket"
  tcp_host: "127.0.0.1"  # TCP bind address
  tcp_port: 7338         # TCP port (pairs with HTTP 7337)
  unix_socket: "/tmp/apm.sock"  # Unix socket path

# Access control configuration
access_control:
  mode: "open"  # Options: open (default), strict, unrestricted
  # open: Read all processes, write hierarchically
  # strict: Both read and write require hierarchical access
  # unrestricted: Full access to all processes

# Search engine configuration
search:
  enabled: true
  index_path: "./apm_search_index"
  commit_interval_seconds: 5
  buffer_size_mb: 50

# Cleanup configuration
cleanup:
  auto_clean_on_startup: false  # Clean stopped processes on daemon start
  retention_hours: 168          # Keep stopped processes for 7 days (0 = forever)
  keep_logs: false              # Keep logs when cleaning processes
  keep_failed: true             # Keep processes that failed (non-zero exit)