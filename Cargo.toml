[package]
name = "agent-process-manager"
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["APM Contributors"]
description = "An AI-native process manager for efficient agent-process interaction"
repository = "https://github.com/sunnya97/agent-process-manager"
homepage = "https://github.com/sunnya97/agent-process-manager"
documentation = "https://github.com/sunnya97/agent-process-manager#readme"
keywords = ["process-manager", "ai", "mcp", "daemon", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "apm"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.11", features = ["completion"] }

# Process and PTY management
portable-pty = "0.8"
nix = { version = "0.29", features = ["process", "signal", "fs"] }
libc = "0.2"

# Pattern matching
regex = "1.10"
once_cell = "1.19"

# System info
sysinfo = "0.31"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Configuration
config = "0.14"
dirs = "5.0"

# WebSocket support
tokio-tungstenite = "0.23"
tungstenite = "0.23"
futures = "0.3"

# Base64 encoding
base64 = "0.22"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# For stripping ANSI codes
strip-ansi-escapes = "0.2"

# Terminal UI
# ratatui = "0.28"
crossterm = "0.28"
terminal_size = "0.3"
colored = "2.1"

# Full-text search
tantivy = "0.22"

# MCP (Model Context Protocol) support
[dependencies.rmcp]
git = "https://github.com/modelcontextprotocol/rust-sdk"
rev = "1b3db8959c2769d593d33977365eaf3d99632551"
features = ["server", "transport-io"]

[dependencies.rmcp-macros]
git = "https://github.com/modelcontextprotocol/rust-sdk"
rev = "1b3db8959c2769d593d33977365eaf3d99632551"

[dev-dependencies]
tempfile = "3.12"
mockall = "0.13"
proptest = "1.5"
criterion = { version = "0.5", features = ["async_tokio"] }
test-case = "3.3"
wiremock = "0.6"
serial_test = "3.1"
hyper = "1.6"

[[bench]]
name = "log_processing"
harness = false

# Unit tests
[[test]]
name = "log_patterns_test"
path = "tests/unit/log_patterns_test.rs"

[[test]]
name = "log_storage_test"
path = "tests/unit/log_storage_test.rs"

[[test]]
name = "log_summarizer_test"
path = "tests/unit/log_summarizer_test.rs"

# Integration tests
[[test]]
name = "agent_api_test"
path = "tests/integration/rust/agent_api_test.rs"

[[test]]
name = "api_integration_test"
path = "tests/integration/rust/api_integration_test.rs"

[[test]]
name = "mcp_simple_test"
path = "tests/integration/rust/mcp_simple_test.rs"

[[test]]
name = "mcp_tcp_test"
path = "tests/integration/rust/mcp_tcp_test.rs"

[[test]]
name = "mcp_test"
path = "tests/integration/rust/mcp_test.rs"

[[test]]
name = "process_supervisor_test"
path = "tests/integration/rust/process_supervisor_test.rs"

[[test]]
name = "search_test"
path = "tests/integration/rust/search_test.rs"

[[test]]
name = "terminal_attachment_test"
path = "tests/integration/rust/terminal_attachment_test.rs"

# End-to-end tests
[[test]]
name = "cli_e2e_test"
path = "tests/e2e/cli_e2e_test.rs"