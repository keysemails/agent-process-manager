[package]
name = "agent-process-manager"
version = "0.1.0"
edition = "2021"
authors = ["APM Contributors"]
description = "An AI-native process manager for efficient agent-process interaction"
license = "MIT"
repository = "https://github.com/agent-process-manager/apm"

[[bin]]
name = "apm"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Process and PTY management
portable-pty = "0.8"
nix = { version = "0.29", features = ["process", "signal", "fs"] }
libc = "0.2"

# Pattern matching
regex = "1.10"
once_cell = "1.19"

# System info
sysinfo = "0.31"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Configuration
config = "0.14"

# WebSocket support
tokio-tungstenite = "0.23"
tungstenite = "0.23"
futures = "0.3"

# Base64 encoding
base64 = "0.22"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# For stripping ANSI codes
strip-ansi-escapes = "0.2"

# Terminal UI
# ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.12"
mockall = "0.13"
proptest = "1.5"
criterion = { version = "0.5", features = ["async_tokio"] }
test-case = "3.3"
wiremock = "0.6"
serial_test = "3.1"
hyper = "1.6"

[[bench]]
name = "log_processing"
harness = false