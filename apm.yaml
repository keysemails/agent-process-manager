# Agent Process Manager Configuration

server:
  host: "0.0.0.0"
  port: 7337

storage:
  database_url: "sqlite:apm.db"
  log_retention_days: 7
  max_log_size_mb: 1000

# MCP Configuration
mcp:
  enabled: true          # Enable MCP server
  transport: "tcp"       # Use TCP transport (or "unix_socket")
  tcp_host: "127.0.0.1"  # Bind to localhost only
  tcp_port: 7338         # TCP port for MCP
  unix_socket: "/tmp/apm.sock"  # Unix socket path (if using unix_socket transport)